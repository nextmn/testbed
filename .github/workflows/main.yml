---
name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install depends
        run: sudo apt-get install -qy j2cli make pylint yamllint parallel python3-matplotlib
      - name: Run tests
        run: make test
